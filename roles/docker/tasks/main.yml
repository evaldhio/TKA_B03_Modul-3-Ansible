- name: Fix apt issue
  shell: sed -i 's/^deb .*jammy-updates/# &/' /etc/apt/sources.list

- name: Update apt
  apt:
    update_cache: yes

- name: Install dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Install Docker Compose plugin
  shell: |
    curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
    chmod +x /usr/local/bin/docker-compose
    mkdir -p /usr/local/lib/docker/cli-plugins
    ln -sf /usr/local/bin/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
  args:
    creates: /usr/local/bin/docker-compose

- name: Start Docker
  shell: dockerd > /dev/null 2>&1 &

- name: Wait Docker ready
  shell: |
    for i in $(seq 1 15); do
      docker info > /dev/null 2>&1 && exit 0
      sleep 2
    done
    exit 1
  changed_when: false
  ignore_errors: yes

- name: Install UFW
  apt:
    name: ufw
    state: present
  ignore_errors: yes

- name: Allow SSH
  ufw:
    rule: allow
    port: 22
    proto: tcp
  ignore_errors: yes

- name: Enable UFW
  ufw:
    state: enabled
  ignore_errors: yes
